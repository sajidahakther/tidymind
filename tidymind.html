<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tidymind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EE;--card:#FBF9F6;--ink:#2E2B28;--mute:#8C867F;--line:#E4DFD8;
  --do:#F3D6CF;--plan:#D9E5D3;--delegate:#D6E2EC;--drop:#E3DDEA;
  --do-d:#B5675A;--plan-d:#6C8B62;--delegate-d:#5F82A0;--drop-d:#8A7BA0;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1C1A;--card:#262320;--ink:#EDE8E2;--mute:#9A948C;--line:#38342F;
  --do:#4A3732;--plan:#364234;--delegate:#333F4A;--drop:#41394A;
  --do-d:#E2A397;--plan-d:#A2C197;--delegate-d:#9BB9D3;--drop-d:#C0B1D6}}
:root[data-theme="dark"]{
  --bg:#1E1C1A;--card:#262320;--ink:#EDE8E2;--mute:#9A948C;--line:#38342F;
  --do:#4A3732;--plan:#364234;--delegate:#333F4A;--drop:#41394A;
  --do-d:#E2A397;--plan-d:#A2C197;--delegate-d:#9BB9D3;--drop-d:#C0B1D6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:36px 20px 80px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);width:max-content}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:34px}
.me{border:1px solid var(--line);background:var(--card);border-radius:50%;padding:2px;display:grid;flex:none}
.me img{width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand svg{width:30px;height:30px;transition:transform .4s cubic-bezier(.3,.8,.3,1)}
.brand:hover svg{transform:rotate(90deg)}
.brand span{font:400 24px/1 var(--serif);letter-spacing:0}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.greet{color:var(--mute);margin:0 0 4px}
h1{font:400 clamp(38px,7vw,64px)/1 var(--serif);margin:0;letter-spacing:-.01em}
h1 em{color:var(--mute)}
.nav{display:flex;gap:6px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;transition:background .15s,transform .1s}
.pill:hover{background:var(--line)}.pill:active{transform:scale(.97)}
.pill[disabled]{opacity:.4;pointer-events:none}
:focus-visible{outline:2px solid var(--delegate-d);outline-offset:2px}
.progress{margin:26px 0 8px;display:flex;align-items:center;gap:14px;color:var(--mute);font-size:13px}
.bar{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--do-d),var(--plan-d),var(--delegate-d));border-radius:6px;transition:width .5s cubic-bezier(.3,.8,.3,1)}
.banner{background:var(--delegate);border-radius:14px;padding:12px 16px;margin:14px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dump{margin:22px 0 14px;display:flex;gap:8px}
.dump input{flex:1;font:400 17px var(--sans);padding:15px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.dump input::placeholder{color:var(--mute)}
.dump button{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 24px;font-weight:500}
.tray{min-height:54px;border:1.5px dashed var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;transition:background .15s}
.tray.over{background:var(--line)}
.tray .hint{color:var(--mute);padding:6px 8px;margin:0;font-size:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;cursor:grab}
.chip .t{flex:1;word-break:break-word}
.sort{display:flex;gap:4px}
.sort button{border:0;border-radius:999px;font-size:12px;padding:5px 10px;color:var(--ink)}
.sort [data-q=do]{background:var(--do)}.sort [data-q=plan]{background:var(--plan)}
.sort [data-q=delegate]{background:var(--delegate)}.sort [data-q=drop]{background:var(--drop)}
.sort button:hover{filter:brightness(.94)}
.x{border:0;background:none;color:var(--mute);font-size:18px;line-height:1;padding:2px 6px;border-radius:8px}
.x:hover{color:var(--ink)}
.grid{display:grid;grid-template-columns:28px 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:10px;margin-top:26px}
.ax{color:var(--mute);font-size:13px;display:flex;align-items:center;justify-content:center}
.ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.q{border-radius:22px;padding:18px;min-height:210px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.q.over{box-shadow:inset 0 0 0 2px var(--ink)}
.q[data-q=do]{background:var(--do)}.q[data-q=plan]{background:var(--plan)}
.q[data-q=delegate]{background:var(--delegate)}.q[data-q=drop]{background:var(--drop)}
.q h2{font:400 26px/1.1 var(--serif);margin:0}
.q[data-q=do] h2{color:var(--do-d)}.q[data-q=plan] h2{color:var(--plan-d)}
.q[data-q=delegate] h2{color:var(--delegate-d)}.q[data-q=drop] h2{color:var(--drop-d)}
.q p{margin:0 0 6px;font-size:13px;color:var(--mute)}
.it{display:flex;align-items:center;gap:10px;padding:7px 6px 7px 10px;border-radius:12px;background:color-mix(in srgb,var(--card) 70%,transparent);cursor:grab}
.it .t{flex:1;word-break:break-word}
.it.done .t{text-decoration:line-through;color:var(--mute)}
.it .tag{font-size:11px;color:var(--mute)}
.ck{appearance:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mute);background:transparent;flex:none;cursor:pointer;display:grid;place-content:center;margin:0;transition:background .2s,border-color .2s}
.ck:checked{background:var(--ink);border-color:var(--ink)}
.ck:checked::after{content:"";width:5px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ro .it,.ro .chip{cursor:default}.ro .ck{pointer-events:none}
.hist{margin-top:44px}
.hist h3{font:400 28px var(--serif);margin:0 0 14px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;transition:transform .15s}
.day:hover{transform:translateY(-2px)}
.day.on{border-color:var(--ink)}
.day b{font-weight:500;display:block}
.day span{color:var(--mute);font-size:13px}
.day .bar{margin-top:8px;height:4px}
.pop{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:9}
@media (max-width:640px){
  .grid{grid-template-columns:1fr;grid-template-rows:none}.ax{display:none}.q{min-height:150px}
  .chip{flex-wrap:wrap}.sort{width:100%}.sort button{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const KEY='eisenhower-matrix-v1';
const QS=[
 {id:'do',name:'Do first',sub:'Urgent and important'},
 {id:'plan',name:'Schedule',sub:'Important, not urgent'},
 {id:'delegate',name:'Delegate',sub:'Urgent, not important'},
 {id:'drop',name:'Let go',sub:'Neither. Be brave.'}];
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ME=null,S={days:{}},today=keyOf(new Date()),view=today,showHist=false;

function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.days)S=r}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function rollover(){
  today=keyOf(new Date());
  if(!S.days[today]){
    const prev=Object.keys(S.days).filter(k=>k<today).sort().pop();
    const carry=prev?S.days[prev].items.filter(i=>!i.done).map(i=>({...i,id:uid(),carried:true})):[];
    S.days[today]={items:carry};save();
  }
}
const items=()=>S.days[view].items;
const ro=()=>view!==today;

function greeting(){
  const h=new Date().getHours();
  const n=ME&&ME.name?', '+ME.name.trim().split(/\s+/)[0]:'';
  return (h<12?'Good morning':h<18?'Good afternoon':'Good evening')+n+'.';
}
function render(){
  const its=items(),done=its.filter(i=>i.done).length,pct=its.length?Math.round(done/its.length*100):0;
  const d=parse(view);
  const title=d.toLocaleDateString('en-GB',{weekday:'long'})+', <em>'+d.toLocaleDateString('en-GB',{day:'numeric',month:'long'})+'</em>';
  const keys=Object.keys(S.days).sort();
  const i=keys.indexOf(view);
  const unsorted=its.filter(x=>!x.q);
  let msg=its.length===0?'A clear page. Start with a brain dump.':pct===100?'Board cleared. Nicely done.':done+' of '+its.length+' done';
  document.getElementById('app').innerHTML=`
  <div class="brandrow">
  <a class="brand" href="#" data-a="today" aria-label="tidymind, back to today">
    <svg viewBox="0 0 34 34" aria-hidden="true"><g opacity=".78"><circle cx="9" cy="9" r="7" fill="var(--do-d)"/><rect x="18" y="2" width="14" height="14" rx="5" fill="var(--plan-d)"/><path d="M9 20.5 14.5 30h-11Z" fill="var(--delegate-d)" stroke="var(--delegate-d)" stroke-width="3" stroke-linejoin="round"/><path d="M25 20l5 5-5 5-5-5Z" fill="var(--drop-d)" stroke="var(--drop-d)" stroke-width="3" stroke-linejoin="round"/></g></svg>
    <span>tidymind</span>
  </a>
  ${ME?`<div class="me" title="${esc(ME.name||'Signed in')}"><img src="${esc(ME.avatarUrl)}" alt="${esc(ME.name||'Your profile')}"></div>`:''}
  </div>
  <header>
    <div><p class="greet">${ro()?'A look back':esc(greeting())}</p><h1>${title}</h1></div>
    <div class="nav">
      <button class="pill" data-a="prev" ${i<=0?'disabled':''} aria-label="Previous day">‹</button>
      <button class="pill" data-a="today" ${ro()?'':'disabled'}>Today</button>
      <button class="pill" data-a="next" ${i>=keys.length-1?'disabled':''} aria-label="Next day">›</button>
      <button class="pill" data-a="hist">${showHist?'Hide history':'History'}</button>
    </div>
  </header>
  ${ro()?`<div class="banner"><span>You're viewing a past day. It's read only.</span><button class="pill" data-a="today">Back to today</button></div>`:''}
  <div class="progress"><span>${msg}</span><div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="${ro()?'ro':''}">
  ${ro()?'':`<div class="dump"><input id="in" placeholder="Brain dump: what's on your mind?" autocomplete="off" maxlength="140"><button data-a="add">Add</button></div>`}
  ${(unsorted.length||!ro())?`<div class="tray" data-drop="">${unsorted.length?unsorted.map(chip).join(''):'<p class="hint">Nothing waiting. New thoughts land here, then sort them below.</p>'}</div>`:''}
  <div class="grid">
    <span></span><div class="ax">Urgent</div><div class="ax">Not urgent</div>
    <div class="ax v">Important</div>${quad('do')}${quad('plan')}
    <div class="ax v">Not important</div>${quad('delegate')}${quad('drop')}
  </div></div>
  ${showHist?hist(keys):''}`;
  const inp=document.getElementById('in');
  if(inp&&window.__focus){inp.focus();window.__focus=false}
}
function chip(x){
  return `<div class="chip" draggable="${!ro()}" data-id="${x.id}"><span class="t">${esc(x.text)}</span>${x.carried?'<span class="tag">carried over</span>':''}
  ${ro()?'':`<span class="sort">${QS.map(q=>`<button data-a="sort" data-q="${q.id}" data-id="${x.id}">${q.name}</button>`).join('')}</span><button class="x" data-a="del" data-id="${x.id}" aria-label="Delete">×</button>`}</div>`;
}
function quad(id){
  const q=QS.find(z=>z.id===id),list=items().filter(x=>x.q===id);
  return `<section class="q" data-q="${id}" data-drop="${id}"><h2>${q.name}</h2><p>${q.sub}</p>
  ${list.map(x=>`<div class="it ${x.done?'done':''}" draggable="${!ro()}" data-id="${x.id}">
    <input type="checkbox" class="ck" data-a="chk" data-id="${x.id}" ${x.done?'checked':''} aria-label="Complete">
    <span class="t">${esc(x.text)}</span>${x.carried?'<span class="tag">carried</span>':''}
    ${ro()?'':`<button class="x" data-a="unsort" data-id="${x.id}" title="Back to brain dump" aria-label="Move back to brain dump">↩</button><button class="x" data-a="del" data-id="${x.id}" aria-label="Delete">×</button>`}</div>`).join('')}
  </section>`;
}
function hist(keys){
  return `<div class="hist"><h3>Your days</h3><div class="days">${keys.slice().reverse().map(k=>{
    const l=S.days[k].items,dn=l.filter(x=>x.done).length,p=l.length?dn/l.length*100:0;
    return `<button class="day ${k===view?'on':''}" data-a="go" data-k="${k}"><b>${parse(k).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}${k===today?' · today':''}</b><span>${dn} of ${l.length} done</span><div class="bar"><i style="width:${p}%"></i></div></button>`}).join('')}</div></div>`;
}
function burst(el){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const r=el.getBoundingClientRect(),cols=['--do-d','--plan-d','--delegate-d','--drop-d'];
  for(let n=0;n<14;n++){
    const p=document.createElement('i');p.className='pop';
    p.style.left=r.left+r.width/2+'px';p.style.top=r.top+r.height/2+'px';
    p.style.background=getComputedStyle(document.documentElement).getPropertyValue(cols[n%4]);
    document.body.appendChild(p);
    const a=Math.random()*6.28,d=30+Math.random()*40;
    p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+14}px) scale(.2)`,opacity:0}],{duration:650,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();
  }
}
function add(){
  const inp=document.getElementById('in');if(!inp)return;
  const t=inp.value.trim();if(!t)return;
  items().push({id:uid(),text:t,q:null,done:false});save();window.__focus=true;render();
}
const find=id=>items().find(x=>x.id===id);
const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.tagName==='A')e.preventDefault();
  const a=b.dataset.a,id=b.dataset.id,keys=Object.keys(S.days).sort();
  if(a==='add')add();
  else if(a==='sort'){find(id).q=b.dataset.q;save();render()}
  else if(a==='unsort'){find(id).q=null;save();render()}
  else if(a==='del'){S.days[view].items=items().filter(x=>x.id!==id);save();render()}
  else if(a==='chk'){const x=find(id);x.done=b.checked;save();if(x.done)burst(b);setTimeout(render,x.done?350:0)}
  else if(a==='prev'){view=keys[keys.indexOf(view)-1];render()}
  else if(a==='next'){view=keys[keys.indexOf(view)+1];render()}
  else if(a==='today'){view=today;render()}
  else if(a==='hist'){showHist=!showHist;render()}
  else if(a==='go'){view=b.dataset.k;render();scrollTo({top:0,behavior:'smooth'})}
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='in')add()});
let drag=null;
app.addEventListener('dragstart',e=>{const el=e.target.closest('[data-id]');if(!el||ro())return;drag=el.dataset.id;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',drag)}catch(_){}});
app.addEventListener('dragover',e=>{const z=e.target.closest('[data-drop]');if(!z||!drag)return;e.preventDefault();z.classList.add('over')});
app.addEventListener('dragleave',e=>{const z=e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
app.addEventListener('drop',e=>{const z=e.target.closest('[data-drop]');if(!z||!drag)return;e.preventDefault();
  const x=find(drag);if(x){x.q=z.dataset.drop||null;save()}drag=null;render()});
app.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'))});

function tick(){
  if(keyOf(new Date())!==today){const wasToday=view===today;rollover();if(wasToday)view=today;render()}
}
load();rollover();render();
(async()=>{try{const u=window.claude&&await claude.use('user');if(u){ME=await u.me();render()}}catch(e){}})();
setInterval(tick,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
</script>
</body>
</html>
